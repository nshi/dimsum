name: Dimsum
options:
  bundleIdPrefix: com.dimsum
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  Dimsum:
    type: application
    platform: macOS
    sources:
      - path: Dimsum
        excludes:
          - Tests/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimsum.app
        INFOPLIST_FILE: Dimsum/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: Dimsum
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DimsumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Dimsum/Tests
    dependencies:
      - target: Dimsum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimsum.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dimsum.app/Contents/MacOS/Dimsum"
        BUNDLE_LOADER: "$(TEST_HOST)"
